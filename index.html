<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dushe Livestock — Prototype</title>
<style>
:root{
  --g:#1F4E3D; --g2:#2E6B53; --gl:#EEF4F0; --bg:#F4F7F4; --cream:#F6F1E4;
  --ink:#1b1b1b; --mute:#5d6b63; --line:#d9e3dc; --red:#8C1D18; --redbg:#F8E1DF; --amber:#8a6a00; --amberbg:#FFF4CC;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E2E8E3;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #bccbc2;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);outline-offset:0;border-color:var(--g2)}

/* ---------- prototype frame ---------- */
#topbar{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:9px 16px;background:#13302a;color:#e6f1ea;font-size:13px}
#topbar b{color:#fff}
#topbar .seg{display:flex;gap:6px}
#topbar .seg button{background:transparent;border:1px solid #8fb5a2;color:#fff;padding:4px 14px;border-radius:999px;font-size:13px}
#topbar .seg button.on{background:#fff;color:var(--g);font-weight:600}
#stage{display:flex;justify-content:center;padding:22px 12px 44px}
#device{position:relative;background:var(--bg);overflow:hidden}
body.phone #device{width:390px;height:844px;border:11px solid #111;border-radius:46px;box-shadow:0 22px 50px rgba(0,0,0,.25)}
body.tablet #device{width:min(1180px,100%);height:min(800px,calc(100vh - 100px));min-height:560px;border:12px solid #111;border-radius:28px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
body.desktop #device{width:min(1280px,100%);height:min(820px,calc(100vh - 100px));min-height:560px;border:1px solid #c3cfc7;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
@media (max-width:560px){
  body.phone #stage{padding:0}
  body.phone #device{width:100vw;height:calc(100dvh - 40px);border:0;border-radius:0;box-shadow:none}
  #topbar .note{display:none}
}

/* ---------- app shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
body.wide #app{flex-direction:row}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--g);color:#fff;flex:none}
body.phone .hdr{padding-top:24px}
.hdr .ttl{flex:1;font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font-size:28px;line-height:1;padding:0 6px 3px 0}
.net{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16);white-space:nowrap}
.net.on{background:#8EDBA8;color:#0d3320}
.main{flex:1;overflow:auto;padding:14px 14px 28px}
body.wide .main{padding:22px 26px 36px}
.tabs{flex:none;display:flex;justify-content:space-around;align-items:flex-end;border-top:1px solid var(--line);background:#fff;padding:6px 4px 16px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);min-width:62px}
.tabs a.on{color:var(--g);font-weight:650}
.tabs svg{width:24px;height:24px}
.tabs a.scanbtn .ic{background:var(--g);color:#fff;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;margin-top:-28px;box-shadow:0 5px 14px rgba(31,78,61,.45)}
.tabs a.scanbtn span{color:var(--g);font-weight:650}
.side{width:236px;flex:none;background:#16372b;color:#d4e5da;display:flex;flex-direction:column;padding:16px 10px;overflow:auto}
body.tablet .side{width:208px}
.side .brand{color:#fff;font-weight:750;font-size:19px;padding:4px 12px 18px;line-height:1.2}
.side .brand small{display:block;font-weight:400;font-size:12px;color:#a8c6b5;margin-top:3px}
.side a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;margin:1px 0}
body.tablet .side a{padding:11px 12px}
.side a svg{width:18px;height:18px;opacity:.85;flex:none}
.side a:hover{background:#21483a}
.side a.on{background:var(--g2);color:#fff}
.side .foot{margin-top:auto;font-size:12px;color:#a8c6b5;padding:12px;border-top:1px solid #2a5243}
.content{flex:1;display:flex;flex-direction:column;min-width:0}

/* ---------- building blocks ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;font-weight:650;margin-bottom:10px;gap:8px}
.card-h small{font-weight:400;color:var(--mute)}
.dash{display:block}
body.wide .dash{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
body.wide .dash>div>.card:last-child{margin-bottom:0}
.narrow{max-width:620px}
.farm .fname{font-size:20px;font-weight:750;color:var(--g)}
.farm .fnum{color:var(--mute);font-size:13px}
.status{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--mute)}
.pill.off{background:var(--amberbg);border-color:#ecd789;color:var(--amber)}
.pill.on{background:#E2F5E8;border-color:#a9dcb9;color:#1d6b3a}
.banner{display:block;background:var(--amberbg);border:1px solid #ecd789;color:#5c4700;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner a,.banner u{text-decoration:underline;font-weight:600}
.banner .bar{margin:8px 0 6px;background:rgba(0,0,0,.08)}
.banner .bar i{background:#8a6a00}
.bigscan{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--g);color:#fff;border-radius:16px;padding:18px;font-size:18px;font-weight:700;margin-bottom:12px;box-shadow:0 6px 16px rgba(31,78,61,.25)}
.bigscan svg{width:28px;height:28px}
.homebtns{display:grid;gap:8px;margin-bottom:12px}
.homebtns .bigscan{margin-bottom:0}
body.wide .homebtns{grid-template-columns:2fr 1fr}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--gl);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--g)}
.stat span{font-size:12px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.chev{color:#9aa9a0;font-size:20px}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.18);flex:none;vertical-align:-3px}
.sw.lg{width:22px;height:22px;border-radius:7px}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.3px}
.muted{color:var(--mute)}
.small{font-size:13px}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--gl);color:var(--g);font-weight:600;white-space:nowrap}
.badge.sold{background:#ececec;color:#555}
.badge.dead{background:var(--redbg);color:var(--red)}
.badge.active{background:#E2F5E8;color:#1d6b3a}
.src{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--amberbg);color:#6b5200;white-space:nowrap;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--g);background:#fff;color:var(--g);border-radius:10px;padding:10px 14px;font-weight:650}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--g);color:#fff}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
body.wide .actions{grid-template-columns:repeat(3,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px}
.chip.sel{border-color:var(--g);background:var(--gl);font-weight:650;box-shadow:inset 0 0 0 1px var(--g)}
.chip .n{font-weight:700;color:var(--g)}
.seg2{display:flex;border:1px solid var(--g);border-radius:10px;overflow:hidden}
.seg2 button{flex:1;border:0;background:#fff;padding:10px;color:var(--g);font-weight:600}
.seg2 button+button{border-left:1px solid var(--g)}
.seg2 button.sel{background:var(--g);color:#fff}
.lbl{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:650}
.lbl .opt{font-weight:400}
.hint{font-size:12.5px;color:var(--mute);margin-top:6px}
.inrow{display:flex;gap:8px}
.inrow input,.inrow select{flex:1;min-width:0}
.err{color:var(--red);background:var(--redbg);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:14px}
.ok{color:#1d6b3a;background:#E2F5E8;border-radius:10px;padding:9px 12px;margin-top:10px;font-size:14px}
.warnbox{color:#5c4700;background:var(--amberbg);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:14px}
.proto{font-size:12px;color:#6b5a1d;background:#FFF9E3;border:1px dashed #e2cf86;border-radius:10px;padding:7px 10px;margin:8px 0}
.viewfinder{position:relative;height:250px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#43564c,#0f1512);overflow:hidden;margin-bottom:6px}
.tagframe{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:200px;height:124px;border:3px dashed #9be3b8;border-radius:14px 14px 44px 44px;display:grid;place-items:center;color:#9be3b8;font-size:13px}
.scanline{position:absolute;left:14%;right:14%;height:2px;background:#7CFFB0;box-shadow:0 0 12px #7CFFB0;top:28%;animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{to{top:66%}}
.vf-hint{position:absolute;bottom:12px;width:100%;text-align:center;color:#e3efe8;font-size:13px}
.readcard{background:#fff;border:2px solid var(--g);border-radius:14px;padding:12px;margin:10px 0}
.readcard .num{font-size:28px;font-weight:750;color:var(--g)}
.tagvis{display:inline-block;font:750 26px ui-monospace,"Cascadia Mono",Consolas,monospace;padding:12px 18px 16px;border-radius:14px 14px 34px 34px;border:1px solid rgba(0,0,0,.2);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.animal-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ownerlink{display:inline-flex;align-items:center;gap:6px;text-decoration:underline;font-size:14px;margin-top:4px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px;margin-top:10px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--g);margin-top:6px;flex:none}
.tl .dot.v{background:#2F6FD0}
.tl .dot.n{background:#C9A227}
.tl .dot.x{background:#8C1D18}
.tl .when{font-size:12px;color:var(--mute)}
.big{font-size:44px;font-weight:800;color:var(--g);line-height:1}
.bignum{display:flex;align-items:baseline;gap:8px;margin:12px 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;background:var(--gl);color:var(--g);padding:9px 10px;position:sticky;top:-22px;font-weight:650;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl tr.click:hover td{background:#f6faf7;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;padding:6px 0}
.check input{width:18px;height:18px;margin:0;flex:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.switch input{width:20px;height:20px;flex:none}
.linkbtn{background:none;border:0;color:var(--g2);text-decoration:underline;padding:0 4px;font-size:13px}
#modal .ov{position:absolute;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
body.wide #modal .ov{align-items:center}
.dlg{background:#fff;width:100%;max-width:470px;border-radius:20px 20px 0 0;padding:18px 18px 22px;max-height:88%;overflow:auto}
body.wide .dlg{border-radius:16px}
.dlg h3{margin:0 0 4px;color:var(--g)}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#13302a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:88%;text-align:center}
body.wide #toast{bottom:30px}
#toast.show{opacity:1}
#toast.warn{background:#6b4f00}
#toast.err{background:var(--red)}
.empty{color:var(--mute);text-align:center;padding:18px}
body.phone .hide-s{display:none}

/* ---------- progress ---------- */
.bar{display:block;flex:1;height:8px;background:#e3eae5;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g2);border-radius:999px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0}
.prow .pl{width:112px;flex:none;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pn{min-width:76px;text-align:right;font-size:13.5px;color:var(--mute);white-space:nowrap}
.prow .pn b{color:var(--ink)}
.pk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;background:#ececec;color:#555}
.pk.ok{background:#E2F5E8;color:#1d6b3a}
.pk.new{background:var(--amberbg);color:var(--amber)}
.pk.bad{background:var(--redbg);color:var(--red)}

/* ---------- owners and profile ---------- */
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:750;flex:none;overflow:hidden;letter-spacing:.5px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.ocards{display:grid;gap:10px}
body.wide .ocards{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.ocard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ocard:hover{border-color:#b5c9bc}
.ocard .grow{display:flex;flex-direction:column;gap:2px}
.ocard .oname{font-size:16px}
.ocount{text-align:center;min-width:54px}
.ocount b{display:block;font-size:21px;color:var(--g);line-height:1.1}
.ocount span{font-size:11.5px;color:var(--mute)}
.prof{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.cover{height:96px;background-image:radial-gradient(circle at 88% 18%,rgba(255,255,255,.38),transparent 46%),linear-gradient(135deg,rgba(255,255,255,.22),rgba(0,0,0,.30))}
.prof-in{padding:0 16px 16px}
.prof-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:-46px}
.prof-top .av{border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.avwrap{position:relative;display:inline-block}
.avcam{position:absolute;right:0;bottom:4px;width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:var(--g);color:#fff;display:grid;place-items:center;padding:0}
.avcam svg{width:16px;height:16px}
.prof-name{font-size:23px;font-weight:800;margin-top:10px;line-height:1.2}
.prof-sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--mute);font-size:13.5px;margin-top:3px}
.prof-bio{margin-top:8px;font-size:14px}
.prof-btns{display:flex;gap:8px;margin-top:14px}
.pbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--gl);border:0;border-radius:12px;padding:10px 4px;color:var(--g);font-size:12.5px;font-weight:650}
.pbtn svg{width:20px;height:20px}
.pbtn:hover{background:#e2ede6}
.prof-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;padding-top:12px;border-top:1px solid var(--line);text-align:center}
.prof-stats div+div{border-left:1px solid var(--line)}
.prof-stats b{display:block;font-size:20px}
.prof-stats span{font-size:12px;color:var(--mute)}
.ptabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.ptabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:650;color:var(--mute)}
.ptabs button.on{background:var(--g);color:#fff}
.info{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.info:last-child{border-bottom:0}
.ii{width:34px;height:34px;border-radius:10px;background:var(--gl);color:var(--g);display:grid;place-items:center;flex:none}
.ii svg{width:18px;height:18px}

/* ---------- backup ---------- */
.ways{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.way{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-size:13.5px;font-weight:600;color:var(--ink)}
.way svg{width:22px;height:22px;color:var(--g)}
.way:hover{border-color:var(--g2)}
.way.last{border-color:var(--g2);box-shadow:inset 0 0 0 1px var(--g2)}
.steps{padding-left:22px;margin:10px 0 4px}
.steps li{margin:7px 0}

/* ---------- export ---------- */
.tblwrap{overflow:auto;max-width:100%}
.tblwrap .tbl th{position:static}
.tblwrap .tbl td{white-space:nowrap}
.colrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.colrow:last-of-type{border-bottom:0}
.colrow.off{color:var(--mute)}
.coln{width:22px;text-align:center;font-weight:750;color:var(--g);font-size:13px;flex:none}
.mv{width:36px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--g);font-size:12px;padding:0;flex:none}
.mv[disabled]{opacity:.3;cursor:default}

/* ---------- voice ---------- */
.voice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin:10px 0}
.voice .mic{width:100%;font-size:16px;padding:13px}
.voice .mic.on{background:#8C1D18;border-color:#8C1D18;color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(140,29,24,.18)}}
.heard{font-size:13px;color:var(--mute);margin-top:8px}
.pending{border:2px solid var(--g);border-radius:12px;padding:10px 12px;margin-top:10px}
.pending .num{font:750 28px ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--g)}
</style>
</head>
<body class="phone">
<div id="topbar">
  <span><b>Dushe Livestock</b> — clickable prototype</span>
  <span class="note">Sample data only · camera, backup and sync are pretend · works with no internet</span>
  <span class="seg"><button id="vPhone" onclick="App.setView('phone')">Phone</button><button id="vTab" onclick="App.setView('tablet')">Tablet</button><button id="vDesk" onclick="App.setView('desktop')">Desktop</button></span>
</div>
<div id="stage"><div id="device"><div id="app"></div><div id="modal"></div><div id="toast"></div></div></div>

<script id="xlsx-lite">
// Minimal .xlsx writer (no libraries): builds the workbook XML and packs it in a ZIP.
window.XlsxLite = (() => {
  const enc = new TextEncoder();
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; table[n] = c >>> 0; }
  const crc32 = (b) => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = table[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

  function zip(files) {
    const parts = [], central = [];
    let offset = 0;
    const d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const f of files) {
      const name = enc.encode(f.name);
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, time, true); lh.setUint16(12, date, true);

const SPOKEN_NUM = { zero: '0', oh: '0', o: '0', nought: '0', nil: '0', one: '1', won: '1', two: '2', to: '2', too: '2', three: '3', tree: '3', four: '4', for: '4',
  five: '5', six: '6', seven: '7', eight: '8', ate: '8', nine: '9', niner: '9' };
const NATO = { alpha: 'A', alfa: 'A', bravo: 'B', charlie: 'C', delta: 'D', echo: 'E', foxtrot: 'F', golf: 'G', hotel: 'H', india: 'I', juliet: 'J', juliett: 'J', kilo: 'K',
  lima: 'L', mike: 'M', november: 'N', oscar: 'O', papa: 'P', quebec: 'Q', romeo: 'R', sierra: 'S', tango: 'T', uniform: 'U', victor: 'V', whiskey: 'W', whisky: 'W', xray: 'X', yankee: 'Y', zulu: 'Z' };
const VOICE_CMD = { next: 'next', yes: 'next', okay: 'next', ok: 'next', correct: 'correct', wrong: 'correct', again: 'correct', no: 'correct', repeat: 'repeat', stop: 'stop' };
// "zero nine zero five one six six five next" → { tag: '09051665', cmd: 'next' }; "double five" → 55; NATO letters → letters
function parseSpoken(text) {
  const words = String(text || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
  let cmd = null;
  while (words.length && VOICE_CMD[words[words.length - 1]]) { cmd = cmd || VOICE_CMD[words[words.length - 1]]; words.pop(); }
  let tag = ''; let times = 1;
  for (const w of words) {
    if (w === 'double') { times = 2; continue; }
    if (w === 'triple') { times = 3; continue; }
    const piece = /^\d+$/.test(w) ? w : SPOKEN_NUM[w] !== undefined ? SPOKEN_NUM[w] : NATO[w] ? NATO[w] : w === 'nam' ? 'NAM' : w.length === 1 ? w.toUpperCase() : null;
    if (piece === null) continue; // words like "tag" or "number" are ignored
    tag += piece.length === 1 ? piece.repeat(times) : piece; times = 1;
  }
  return { tag: tag ? normTag(tag) : '', cmd };
}
const SR = () => window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
function speak(text) {
  try { if (!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(text); u.lang = 'en-ZA'; u.rate = 1.05; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { /* no voice on this device */ }
}

  vaccNew() {

  vaccSession(id) {
    const s = session(id); if (!s) return { title: 'Not found', back: '#/vacc', body: '<div class="empty">Session not found.</div>' };
    const p = progress(s); const open = !s.endedAt;

    const summary = `<div class="card"><div class="muted small"><span class="badge">${kindOf(s)[0]}</span> Started ${h(s.date)} · ${open ? `running${day > 1 ? ` — day ${day}` : ''}` : 'ended ' + fmtDT(s.endedAt)}${(s.reopened || []).length ? ` · reopened ${fmtDT(s.reopened[s.reopened.length - 1])}` : ''}</div>

      <div class="small" style="margin-top:8px"><b>${p.total - p.done}</b> not ${V} yet${p.paper ? ` · ${p.paper} from paper notes` : ''}${p.extra ? ` · ${p.extra} outside the group` : ''}</div></div>`;
    const cats = `<div class="card"><div class="card-h">By category <small>${V} out of ${s.group ? 'the group' : 'all active'}</small></div>
      ${CATS.filter((c) => p.cats[c].total).map((c) => `<div class="prow"><span class="pl">${CATS_PL[c]}</span>${bar(p.cats[c].done, p.cats[c].total)}<span class="pn"><b>${p.cats[c].done}</b> of ${p.cats[c].total}</span></div>`).join('') || '<div class="empty">No cattle in this session.</div>'}</div>`;
    const owners = `<div class="card"><div class="card-h">By owner</div>
      ${S.owners.filter((o) => p.owners[o.id] && p.owners[o.id].total).map((o) => `<div class="prow"><span class="pl">${avatar(o, 22)} ${h(o.name)}</span>${bar(p.owners[o.id].done, p.owners[o.id].total)}<span class="pn"><b>${p.owners[o.id].done}</b> of ${p.owners[o.id].total}</span></div>`).join('') || '<div class="empty">No cattle in this session.</div>'}</div>`;
    const miss = `<div class="card"><div class="card-h">Not ${V} yet <small>${p.missing.length}</small></div>
      <div class="btnrow"><button class="btn sm" onclick="App.toggleMissing()">${UI.missOpen ? 'Hide list' : 'See list'}</button><button class="btn sm" onclick="App.printMissing('${id}')">${icon('print')} Print</button>
        <button class="btn sm" onclick="App.exportMissing('${id}','pdf')">${icon('pdf')} PDF</button><button class="btn sm" onclick="App.exportMissing('${id}','xlsx')">${icon('sheet')} Excel</button></div>
      ${UI.missOpen ? `<div style="margin-top:8px">${p.missing.map((a) => `<a class="row" href="#/animal/${a.id}">${swatch(a.tagColour)}<span class="mono">${h(a.tag)}</span><span class="grow small muted">${CAT[a.category]} · ${h(a.breed)} · ${h(ownerName(a.ownerId))}</span></a>`).join('') || '<div class="empty">All done.</div>'}</div>` : ''}</div>`;

    const list = `<div class="card"><div class="card-h">${open ? 'Last entered' : 'Animals vaccinated'} <small>${vs.length}</small></div>${vs.slice().reverse().slice(0, open ? 8 : 400).map(vRow).join('') || '<div class="empty">Nothing entered yet.</div>'}</div>`;
    const end = open ? `<button class="btn warn block" onclick="App.dlgEndSession('${id}')">End session</button>` : `<button class="btn block" onclick="App.dlgReopen('${id}')">Reopen session</button>`;
    const nam = `<div class="card"><div class="card-h">For NamLITS and the register <small>${vs.length} ear tags</small></div>
      <div class="small muted">Records of vaccinations and treatments must be kept by law. NamLITS online asks for the ear tag number of every animal done — copy them here and paste them there when you have internet.</div>
      <div class="btnrow" style="margin-top:10px"><button class="btn sm" ${vs.length ? '' : 'disabled'} onclick="App.copyTags('${id}')">${icon('copy')} Copy ear tags</button><button class="btn sm" ${vs.length ? '' : 'disabled'} onclick="App.saveTags('${id}')">Save list (.txt)</button></div>
      <div class="btnrow" style="margin-top:8px"><button class="btn sm" ${vs.length ? '' : 'disabled'} onclick="App.exportRecord('${id}','pdf')">${icon('pdf')} Record (PDF)</button><button class="btn sm" ${vs.length ? '' : 'disabled'} onclick="App.exportRecord('${id}','xlsx')">${icon('sheet')} Record (Excel)</button></div></div>`;
    let body;
    if (VIEW === 'tablet' && open) body = `<div class="dash"><div>${scanPanel()}<div style="height:12px"></div>${acts}${list}</div><div>${summary}${cats}${miss}${nam}${owners}${end}</div></div>`;

    else if (!open) body = summary + end + acts + cats + miss + nam + owners + list;
    else body = summary + acts + cats + miss + nam + owners + list + end;
    return { title: open ? 'Session running' : 'Session summary', back: '#/vacc', body };

        ['Categories', CATS.filter((c) => e.cats.has(c)).map((c) => CATS_PL[c]).join(', ')], ['Breeds', S.breeds.filter((b) => !e.xb.has(b)).join(', ')],
        ['Include sold and dead', e.inc ? 'Yes' : 'No'], ['Columns', rows[0].join(', ')], ['Number of cattle', list.length]];
      bytes = XlsxLite.workbook([
        { name: 'Cattle', rows, widths: colWidths(rows), filter: true },
        { name: 'Summary', rows: summary, widths: [18, 11, 8, 9, 8, 8, 14] },
        { name: 'Breeds', rows: breeds, widths: [16, 8, 9, 8, 8, 14] },
        { name: 'Filters', rows: filters, widths: [22, 60] },
      ]);
      type = XLSX;
    }
    return { bytes, type, fmt, name: `Dushe_Cattle_${who}_${today()}.${fmt}`, count: list.length, who: who === 'Selected' ? owners.map((o) => o.name).join(', ') : who, cols: rows[0].join(', ') };
  },
  dlgBackup(k) {
    const [l, , steps] = BACKUP_WAYS[k];
    const blocked = k === 'bt' && S.device === 'iPhone';
    modal(`<h3>${h(l)}</h3><ol class="steps">${steps.map((x) => `<li>${h(x)}</li>`).join('')}</ol>
      ${blocked ? '<div class="warnbox">An iPhone cannot send files to Windows over Bluetooth — use Wi-Fi or a USB drive.</div>' : ''}
      <div class="btnrow" style="margin-top:14px"><button class="btn" onclick="App.close()">Cancel</button><button class="btn pri" ${blocked ? 'disabled' : ''} onclick="App.backup('${k}')">Back up now (pretend)</button></div>`);
  },
  backup(k) { Act.backup(k); close(); toast(`Backed up — ${BACKUP_WAYS[k][0]} (pretend)`); render(); },
  setOnline(v) { S.online = v; save(); render(); },
  saveBackupFile() { download(JSON.stringify(S, null, 1), `Dushe_backup_${today()}.json`, 'application/json'); toast('Backup file saved'); },
  sync() { try { const n = Act.sync(); toast(`Synced — ${n} changes sent (pretend)`); } catch (e) { toast(e.message, 'err'); } render(); },
  saveFarm() { Act.saveFarm({ name: $('#fn').value, number: $('#fnum').value, device: $('#fdev').value }); toast('Farm details saved'); render(); },
  addBreed() { try { const b = Act.addBreed($('#nbreed').value); toast(`Breed added — ${b}`); render(); } catch (e) { $('#berr').innerHTML = `<div class="err">${h(e.message)}</div>`; } },
  reset() {
    if (!confirm('Reset all sample data?')) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = seed(); save(); UI.ex = null; UI.nf = null; UI.vn = null; UI.paper = null; UI.missOpen = false; UI.of = { id: null, tab: 'cattle', cat: 'all', q: '', inactive: false };
    toast('Sample data reset'); go('#/home');
  },
  // for screenshots and testing
  _state: () => S, _ui: () => UI, _act: Act, _render: render, _progress: (id) => progress(session(id)),
};

// ---------- start ----------
load();
try { const v = new URLSearchParams(location.search).get('view') || localStorage.getItem(KEY + '-view'); VIEW = ['phone', 'tablet', 'desktop'].includes(v) ? v : 'phone'; } catch (e) { VIEW = 'phone'; }
window.addEventListener('hashchange', () => {
  UI.read = null;
  if (!/^#\/(scan|vacc\/)/.test(location.hash)) { UI.result = null; if (UI.voice.on) { UI.voice.on = false; try { if (recog) recog.stop(); } catch (e) {} } }
  render();
});
render();
return api;
})();
</script>
